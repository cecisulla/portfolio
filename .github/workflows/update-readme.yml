name: Atualizar README com Imagens

on:
  push:
    paths:
      - 'assets/img/portfolio/**'
  workflow_dispatch:

# Garante permissão para o GITHUB_TOKEN alterar e enviar commits de volta
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repositorio checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar script de atualizacao
        run: python .github/scripts/update_readme.py

      - name: Commit e Push automatico
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: atualiza imagens dinamicamente no README"
          branch: main